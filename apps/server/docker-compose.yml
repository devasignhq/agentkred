# Local Postgres for development and the database tests, with a second database for tests.
services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: agentkred
            POSTGRES_PASSWORD: agentkred
            POSTGRES_DB: agentkred
        ports:
            - "5433:5432"
        volumes:
            - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U agentkred"]
            interval: 2s
            retries: 30

volumes:
    postgres-data:
